name: Desktop Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate version tag as data
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$RELEASE_TAG" == "v$version" ]] || exit 1

  windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Package Windows
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: .\scripts\package.ps1 -ExpectedVersion $env:RELEASE_TAG.Substring(1)
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            release/ReminderBuddy-Setup-*.exe
            release/ReminderBuddy-Windows-*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

  macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: osx-arm64
            os: macos-15
          - runtime: osx-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Package Mac beta
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: bash scripts/package-macos.sh "$RUNTIME"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runtime }}
          path: |
            release/*.zip
            release/SHA256SUMS-*.txt
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Combine checksums and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          cat release/SHA256SUMS-osx-*.txt >> release/SHA256SUMS.txt
          rm release/SHA256SUMS-osx-*.txt
          gh release create "$RELEASE_TAG" --repo "$REPOSITORY" \
            --draft --generate-notes --title "Reminder Buddy $RELEASE_TAG (macOS beta)" \
            release/*.exe release/*.zip release/SHA256SUMS.txt
