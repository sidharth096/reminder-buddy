name: Windows Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  package:
    name: Test and package
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate version tag
        shell: powershell
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match VERSION $version."
          }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build, test, and package
        shell: powershell
        run: |
          $expectedVersion = "${{ github.ref_name }}".Substring(1)
          .\scripts\package.ps1 -ExpectedVersion $expectedVersion

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReminderBuddy-${{ github.ref_name }}
          path: |
            release/ReminderBuddy-Setup-*.exe
            release/ReminderBuddy-Windows-*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create draft GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          gh release create "${{ github.ref_name }}" `
            --repo "${{ github.repository }}" `
            --draft `
            --generate-notes `
            --title "Reminder Buddy ${{ github.ref_name }}" `
            "release/ReminderBuddy-Setup-$version.exe" `
            "release/ReminderBuddy-Windows-$version.zip" `
            release/SHA256SUMS.txt
