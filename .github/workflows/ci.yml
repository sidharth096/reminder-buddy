name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build application and run core tests
        shell: powershell
        run: .\build.ps1 -Test

      - name: Upload portable application
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ReminderBuddy-Windows
          path: dist/ReminderBuddy.exe
          if-no-files-found: error
          retention-days: 7
